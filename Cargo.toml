[package]
name = "aetherkv"
version = "0.1.0"
edition = "2021"
authors = ["Mohamed Hamed <mohamedus.1970.hm@gmail.com>"]
description = "High-Throughput Asynchronous LSM Storage Engine in Rust (Lock-Free Arena, Direct I/O, AVX2 Bloom, Anti-Stall Compaction)"
license = "MIT"
repository = "https://github.com/mohameddhamed/aetherkv"
keywords = ["storage-engine", "lsm-tree", "database", "lock-free", "io-uring"]
categories = ["database-implementations", "concurrency", "embedded-database"]

[dependencies]
libc = "0.2"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = "3.10"
hdrhistogram = "7.5"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "aetherkv"
path = "src/main.rs"

[[bench]]
name = "open_loop_bench"
harness = false

[[bench]]
name = "throughput_criterion"
harness = false

[features]
default = []
loom = ["dep:loom"]

[dependencies.loom]
version = "0.7"
optional = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
