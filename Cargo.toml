[package]
name = "aetherkv"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
parking_lot = "0.12"
crossbeam-utils = "0.8"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = "3.10"
hdrhistogram = "7.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "open_loop_bench"
harness = false

[[bench]]
name = "throughput_criterion"
harness = false

[features]
default = []
loom = ["dep:loom"]

[dependencies.loom]
version = "0.7"
optional = true
